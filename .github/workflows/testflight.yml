name: TestFlight

# Signs and uploads a build to App Store Connect, from which TestFlight
# distribution is managed.
#
# Every push to main ships a build, so getting a version to testers costs
# nothing beyond merging. Tags still work for marking a release, and manual
# dispatch is there for re-running a failed upload.
#
# All three triggers need write access to the repository. That matters because
# this repo is public: a pull_request trigger would be wrong here, though GitHub
# does withhold secrets from fork PRs. Consider putting this job behind a
# protected Environment as well, so uploads under the company's Apple account
# need an approval first.
#
# Uploads are skipped when the App Store Connect secrets are absent, so the
# workflow sits harmlessly until the one-time account setup is done rather than
# failing red on every push.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      # Decides whether there is anything to do, rather than failing. Since this
      # now runs on every push to main, a repo without the Apple credentials
      # configured yet would otherwise go red on each one, training everyone to
      # ignore it. A manual dispatch still fails loudly, because asking for an
      # upload and silently getting none is worse than an error.
      - name: Check credentials are present
        id: creds
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$KEY_ID" ]      || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ]   || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -n "$TEAM_ID" ]     || missing="$missing APPLE_TEAM_ID"

          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## TestFlight upload skipped"
            echo
            echo "These repository secrets are not set:"
            echo '```'
            for name in $missing; do echo "$name"; done
            echo '```'
            echo "The TestFlight section of README.md covers creating them."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Upload was requested manually but credentials are missing:$missing" >&2
            exit 1
          fi
          echo "No App Store Connect credentials configured; skipping upload."

      - name: Install App Store Connect API key
        if: steps.creds.outputs.ready == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          chmod 700 ~/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      # App Store Connect rejects a build number it has already seen, so it
      # comes from the run number rather than the project file. The marketing
      # version comes from the tag when there is one.
      - name: Work out version numbers
        if: steps.creds.outputs.ready == 'true'
        id: version
        run: |
          # A tag names the version. A push to main has no tag to read, so it
          # reuses whatever the project already declares.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            marketing="${GITHUB_REF_NAME#v}"
          else
            marketing=$(
              /usr/libexec/PlistBuddy -c "Print :objects:FT000000000000000000000F:buildSettings:MARKETING_VERSION" \
                facetrkr.xcodeproj/project.pbxproj 2>/dev/null \
              || grep -m1 -o 'MARKETING_VERSION = [^;]*' facetrkr.xcodeproj/project.pbxproj | cut -d' ' -f3
            )
            marketing="${marketing:-0.1}"
          fi
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Uploading $marketing (${GITHUB_RUN_NUMBER})"

      - name: Archive
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project facetrkr.xcodeproj \
            -scheme facetrkr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/facetrkr.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            2>&1 | tee archive.log

      - name: Export and upload to App Store Connect
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/facetrkr.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee export.log

      # xcodebuild writes its real App Store Connect exchange to a temp folder
      # and only prints the path. Without this the logs say "permission error"
      # and nothing about why.
      - name: Collect distribution logs
        if: failure() && steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p distribution-logs
          find "${TMPDIR:-/tmp}" -maxdepth 2 -name '*.xcdistributionlogs' -print0 2>/dev/null \
            | xargs -0 -I {} cp -R {} distribution-logs/ 2>/dev/null || true
          find distribution-logs -type f | head -20 || true

      - name: Summarise failures
        if: failure() && steps.creds.outputs.ready == 'true'
        run: |
          {
            echo "## Upload failed"
            echo
            echo '```'
            grep -hE '(error|Error|failed): ' archive.log export.log 2>/dev/null | sort -u | head -40 \
              || echo 'No error lines matched — check the full logs.'
            echo '```'

            # These two arrive together and are almost always the same two
            # causes. Saying so here saves reading the Apple forums.
            if grep -q 'Cloud signing permission error\|No profiles for' export.log 2>/dev/null; then
              echo
              echo "### What this usually means"
              echo
              echo "The archive signed fine with a **development** identity, but uploading needs an"
              echo "**Apple Distribution** certificate and an App Store profile, and the API key could"
              echo "not create one. Two causes, and both may apply:"
              echo
              echo "1. **No app record in App Store Connect** for this bundle identifier, so there is"
              echo "   nothing for an App Store profile to attach to. Register the App ID under"
              echo "   Certificates, Identifiers & Profiles first, then create the app."
              echo "2. **The API key's role is too low.** A Developer-role key can mint development"
              echo "   certificates but not distribution ones. It needs App Manager with access to"
              echo "   certificates, or Admin."
              echo
              echo "The \`distribution-logs\` artifact on this run holds Apple's side of the exchange."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The key is a company credential. Do not leave it on the runner, even
      # though the runner is ephemeral.
      - name: Remove the API key
        if: always() && steps.creds.outputs.ready == 'true'
        run: rm -rf ~/private_keys

      - name: Upload logs
        if: always() && steps.creds.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
            distribution-logs/
          if-no-files-found: ignore
