name: TestFlight

# Signs and uploads a build to App Store Connect, from which TestFlight
# distribution is managed.
#
# Only a tag push or a manual dispatch can start this, and both need write
# access to the repository. That matters because this repo is public: a
# pull_request trigger would be wrong here, though GitHub does withhold secrets
# from fork PRs. Consider putting this job behind a protected Environment as
# well, so uploads under the company's Apple account need an approval first.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      # Fails early and by name rather than 20 minutes later inside xcodebuild,
      # where a missing credential surfaces as an opaque signing error.
      - name: Check credentials are present
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$KEY_ID" ]      || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "$ISSUER_ID" ]   || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -n "$TEAM_ID" ]     || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing" >&2
            echo "See the TestFlight section of README.md for how to create them." >&2
            exit 1
          fi

      - name: Install App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          chmod 700 ~/private_keys
          printf '%s\n' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      # App Store Connect rejects a build number it has already seen, so it
      # comes from the run number rather than the project file. The marketing
      # version comes from the tag when there is one.
      - name: Work out version numbers
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            marketing="${GITHUB_REF_NAME#v}"
          else
            marketing="0.1"
          fi
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Uploading $marketing (${GITHUB_RUN_NUMBER})"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project facetrkr.xcodeproj \
            -scheme facetrkr \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/facetrkr.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            2>&1 | tee archive.log

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/facetrkr.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee export.log

      - name: Summarise failures
        if: failure()
        run: |
          {
            echo '## Upload failed'
            echo
            echo '```'
            grep -hE '(error|Error|failed): ' archive.log export.log 2>/dev/null | sort -u | head -40 \
              || echo 'No error lines matched — check the full logs.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The key is a company credential. Do not leave it on the runner, even
      # though the runner is ephemeral.
      - name: Remove the API key
        if: always()
        run: rm -rf ~/private_keys

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore
